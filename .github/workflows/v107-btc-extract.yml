name: V107 BTC lab extract
on:
  push:
    branches: [v107-btc-lab-20260928]
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install "huggingface_hub[hf_xet]" duckdb pandas pyarrow pytz
      - run: python tools/v107_btc_extract_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: v107-btc-public-extract
          path: v107_btc_public_extract/
          retention-days: 1
