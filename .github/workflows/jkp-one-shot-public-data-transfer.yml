name: jkp-one-shot-public-data-transfer

on:
  push:
    branches:
      - jkp-data-transfer-20260924

permissions:
  contents: read

jobs:
  inspect-official-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Download official JKP availability manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          curl -fL --retry 5 --retry-delay 2             'https://jkpfactors-data.s3.amazonaws.com/public/availability.json'             -o artifact/availability.json
          test -s artifact/availability.json
          sha256sum artifact/availability.json
      - name: Inspect manifest structure and canonical all-factor availability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, re
          p=pathlib.Path("artifact/availability.json")
          obj=json.loads(p.read_text())
          print("top_type",type(obj).__name__)
          if isinstance(obj,dict):
              print("top_keys",list(obj)[:50])
          matches=[]
          leaves=[]
          def walk(x,path=()):
              if isinstance(x,dict):
                  for k,v in x.items():
                      walk(v,path+(str(k),))
              elif isinstance(x,list):
                  for i,v in enumerate(x):
                      walk(v,path+(str(i),))
              else:
                  leaves.append((path,x))
                  joined="|".join(path+(str(x),))
                  if "all_factors" in joined and "monthly" in joined and "vw_cap" in joined:
                      matches.append((path,x))
          walk(obj)
          print("leaf_count",len(leaves))
          print("canonical_match_count",len(matches))
          for path,val in matches[:250]:
              print("MATCH",repr(path),repr(val))
          # Also search the raw JSON for literal canonical archive names.
          raw=p.read_text()
          pat=re.compile(r"\\[([a-z0-9_]+)\\]_\\[all_factors\\]_\\[monthly\\]_\\[vw_cap\\]\\.zip",re.I)
          names=sorted(set(pat.findall(raw)))
          print("literal_archive_country_count",len(names))
          print("literal_archive_countries",names)
          PY
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: jkp-official-availability-manifest
          path: artifact/availability.json
          if-no-files-found: error
          retention-days: 7
