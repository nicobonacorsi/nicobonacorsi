name: V110 public market data extract
on:
  push:
    branches: [v110-market-data-extract-20260928]
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install "huggingface_hub[hf_xet]" pandas pyarrow
      - run: python tools/v110_market_extract.py
      - uses: actions/upload-artifact@v4
        with:
          name: v110-market-public
          path: v110_market_public/
          retention-days: 1
