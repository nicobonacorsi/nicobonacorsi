name: V107 BTC data audit
on:
  push:
    branches: [v107-btc-lab-20260928]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install "huggingface_hub[hf_xet]" duckdb pandas pyarrow
      - run: python tools/v107_btc_data_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: v107-btc-data-audit
          path: v107_audit.json
          retention-days: 1
