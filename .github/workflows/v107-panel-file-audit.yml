name: V107 untouched panel file audit
on:
  push:
    branches: [v107-btc-lab-20260928]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install "huggingface_hub"
      - run: python tools/v107_panel_file_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: v107-panel-file-audit
          path: v107_panel_file_audit.json
          retention-days: 1
