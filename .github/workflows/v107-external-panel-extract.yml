name: V107 frozen external panel extract
on:
  push:
    branches: [v107-external-panel-data-20260928]
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install "huggingface_hub[hf_xet]" duckdb pyarrow pytz
      - run: python tools/v107_external_panel_extract.py
      - uses: actions/upload-artifact@v4
        with:
          name: v107-external-panel
          path: v107_external_panel/
          retention-days: 1
