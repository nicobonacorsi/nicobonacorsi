name: V109 Hyperliquid funding dev slice
on:
  push:
    branches: [v109-hyperliquid-dev-20260928]
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install "huggingface_hub[hf_xet]" pandas pyarrow
      - run: python tools/v109_hl_funding_dev.py
      - uses: actions/upload-artifact@v4
        with:
          name: v109-hl-funding-dev
          path: v109_hl_dev/
          retention-days: 1
